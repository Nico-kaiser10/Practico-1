<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Biblioteca Virtual</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/Login.css">
</head>
<body>

  <div class="libro" id="libro">

    <div class="pagina-der">
      <h2>Iniciar sesión</h2>
      <div id="error" class="alert alert-danger d-none py-2"></div>

      <form id="formLogin">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>
        <div class="mb-4">
          <label for="contrasenia" class="form-label">Contraseña</label>
          <input type="password" id="contrasenia" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-ingresar w-100">Ingresar</button>
      </form>
    </div>

    <div class="tapa" id="tapa">
      <div class="cara frente">
        <div class="adorno">📖</div>
        <h1>Biblioteca<br>Virtual</h1>
        <p class="pista">Tocá para abrir</p>
      </div>

      <div class="cara dorso">
        <h2>Bienvenido/a</h2>
        <p>Ingresá tus datos en la página de al lado para entrar a tu biblioteca.</p>
        <a href="/front/index.html">Volver al inicio</a>
        <button type="button" class="link mt-2" id="cerrar">Cerrar libro</button>
      </div>
    </div>
  </div>

  <script src="/front/dist/js/auth.js"></script>
  <script src="../js/Login.js"></script>
</body>
</html>
