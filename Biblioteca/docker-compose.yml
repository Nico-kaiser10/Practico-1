services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html/api
      - ./front:/var/www/html/front
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: biblioteca
      MARIADB_USER: biblioteca_user
      MARIADB_PASSWORD: biblioteca_pass
    volumes:
      - db_data:/var/lib/mysql
      - ./api/config/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data: